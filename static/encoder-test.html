<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>MP4-Encoder Selbsttest</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; padding: 24px; max-width: 720px; margin: auto; }
    h1 { font-size: 18px; }
    #log { background: #1e293b; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 13px; white-space: pre-wrap; line-height: 1.5; }
    .ok { color: #4ade80; }
    .err { color: #f87171; }
    canvas { border: 1px solid #334155; border-radius: 6px; margin-top: 12px; }
    video { width: 100%; margin-top: 12px; border-radius: 6px; }
    button { margin-top: 12px; padding: 8px 16px; background: #2563eb; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
  </style>
</head>
<body>
  <h1>🎬 MP4-Encoder Selbsttest (WebCodecs + mp4-muxer)</h1>
  <p>Dieser Test erzeugt eine 2-Sekunden-Animation (bewegter Kreis) rein im Browser als H.264-MP4 — exakt der Mechanismus, den der Video-Export jetzt nutzt.</p>
  <div id="log">Starte Test…\n</div>
  <canvas id="c" width="640" height="360"></canvas>
  <video id="out" controls></video>
  <button id="dl" style="display:none">⬇️ MP4 herunterladen</button>

  <script type="module">
    import { createMp4Encoder, isMp4EncodingSupported } from "/static/js/canvas/mp4-encoder.js";

    const log = document.getElementById("log");
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const out = document.getElementById("out");
    const dl = document.getElementById("dl");

    function line(msg, cls) {
      const span = document.createElement("span");
      if (cls) span.className = cls;
      span.textContent = msg + "\n";
      log.appendChild(span);
    }

    (async () => {
      try {
        line("1. Prüfe WebCodecs-Support…");
        const supported = await isMp4EncodingSupported();
        if (!supported) {
          line("   ✗ WebCodecs H.264 wird NICHT unterstützt. Nutze Chrome/Edge 94+ oder Safari 16.4+.", "err");
          return;
        }
        line("   ✓ H.264-Encoding unterstützt.", "ok");

        line("2. Erzeuge Encoder (640×360 @ 30fps)…");
        const fps = 30;
        const totalFrames = 60; // 2 Sekunden
        const encoder = await createMp4Encoder({ width: 640, height: 360, fps });
        line("   ✓ Encoder + mp4-muxer geladen.", "ok");

        line("3. Rendere & encodiere " + totalFrames + " Frames…");
        for (let f = 0; f <= totalFrames; f++) {
          const t = f / totalFrames;
          ctx.fillStyle = "#15803d";
          ctx.fillRect(0, 0, 640, 360);
          ctx.fillStyle = "#facc15";
          const x = 60 + t * 520;
          const y = 180 + Math.sin(t * Math.PI * 2) * 120;
          ctx.beginPath();
          ctx.arc(x, y, 28, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#fff";
          ctx.font = "20px sans-serif";
          ctx.fillText("Frame " + f, 20, 30);
          encoder.addFrame(canvas);
          if (f % 10 === 0) await new Promise(r => setTimeout(r, 0));
        }
        line("   ✓ Alle Frames encodiert (" + encoder.frameCount + ").", "ok");

        line("4. Finalisiere MP4…");
        const blob = await encoder.finalize();
        line("   ✓ MP4-Blob erzeugt: " + (blob.size / 1024).toFixed(1) + " KB, Typ " + blob.type, "ok");

        const url = URL.createObjectURL(blob);
        out.src = url;
        dl.style.display = "inline-block";
        dl.onclick = () => {
          const a = document.createElement("a");
          a.href = url; a.download = "encoder_selbsttest.mp4"; a.click();
        };

        line("\n✅ ERFOLG — der Browser-MP4-Export funktioniert. Video oben abspielbar.", "ok");
      } catch (e) {
        line("\n✗ FEHLER: " + (e && e.message ? e.message : e), "err");
        console.error(e);
      }
    })();
  </script>
</body>
</html>
